name: GEDER

on:
  push:
    paths: ["geder/**", ".github/workflows/geder.yml"]
  pull_request:
    paths: ["geder/**", ".github/workflows/geder.yml"]

defaults:
  run:
    working-directory: geder

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Listes de départ valides
        run: cargo run -q -p geder-list -- check lists/*.txt
      - name: Tunnel de bout en bout (interface TUN, root)
        run: |
          bin=$(cargo test -p geder-tunnel --test tun_e2e --no-run --message-format=json \
            | jq -r 'select(.target.name == "tun_e2e" and .executable != null) | .executable')
          sudo "$bin" --ignored
      - name: Liaison JNI, tunnel compris (JVM de bureau, root)
        run: ./core/jni-test/run.sh --tun
